publish_to: "none"
version: 1.2.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  video_player: ^2.10.0
  persian_datetime_picker: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/130315.png
    - assets/Intro.mp4
    - assets/images/startup.mp4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/130315.png"
  remove_alpha_ios: true
