name: caracal_tuning
description: CARACAL TUNING - Drive, Learn, Upgrade
publish_to: "none"
version: 1.1.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  audioplayers: ^6.1.0
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/130315.png
    - assets/images/Intro.mp4
    - Caracal (1).mp3
    - Pagani-Zonda (2).mp3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/130315.png"
  remove_alpha_ios: true
