name: Build CARACAL ADMIN

on:
  push:
    branches: [main]
    paths:
      - 'admin_app/**'
      - 'admin-web/**'
      - '.github/workflows/build-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-android:
    name: Build Admin Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --project-name caracal_admin --platforms=android .
          fi

      - name: Configure Android SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -E -i 's/^[[:space:]]*compileSdk[[:space:]]*=.*/    compileSdk = 36/' android/app/build.gradle.kts
            grep -E 'compileSdk[[:space:]]*=[[:space:]]*36' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -E -i 's/^[[:space:]]*compileSdkVersion[[:space:]].*/    compileSdkVersion 36/' android/app/build.gradle
            grep -E 'compileSdkVersion[[:space:]]+36' android/app/build.gradle
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Force Android compile SDK 36 for cached Flutter plugins
        run: |
          python3 - <<'PY'
          import pathlib, re, os
          root = pathlib.Path(os.environ["HOME"]) / ".pub-cache" / "hosted" / "pub.dev"
          changed = []
          for path in root.rglob("*"):
              if path.name not in ("build.gradle", "build.gradle.kts") or not path.is_file():
                  continue
              try:
                  original = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              updated = re.sub(r"(?m)^(\s*compileSdkVersion\s+)\\d+\s*$", r"\g<1>36", original)
              updated = re.sub(r"(?m)^(\s*compileSdk\s*=\s*)\\d+\s*$", r"\g<1>36", updated)
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))
          print("Patched plugin Gradle files:", *changed, sep="\n")
          file_picker = list(root.glob("file_picker-*/android/build.gradle*"))
          if not file_picker:
              raise SystemExit("file_picker Gradle file not found in pub cache")
          for path in file_picker:
              data = path.read_text()
              print(f"Verified {path}:")
              print("\n".join(line for line in data.splitlines() if "compileSdk" in line))
              if not re.search(r"compileSdk(?:Version)?\s*(?:=\s*)?36", data):
                  raise SystemExit("file_picker compile SDK was not raised to 36")
          PY


      - name: Analyze admin app
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        env:
          SUPABASE_URL: https://fabbzaviesndfobxhrxf.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhYmJ6YXZpZXNuZGZvYnhocnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MzEyNjcsImV4cCI6MjEwOTEwNzI2N30.mwJfaLmV0dKso2dsXxX3gr2naFYqFEFtGi6Nw731RNk
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: CARACAL-ADMIN-APK
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  admin-web:
    name: Build Admin Web Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web panel
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fabbzaviesndfobxhrxf.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhYmJ6YXZpZXNuZGZvYnhocnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MzEyNjcsImV4cCI6MjEwOTEwNzI2N30.mwJfaLmV0dKso2dsXxX3gr2naFYqFEFtGi6Nw731RNk
        run: |
          npm run build
