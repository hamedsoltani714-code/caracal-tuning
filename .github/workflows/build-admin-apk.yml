name: Build CARACAL ADMIN APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin_app/**'
      - '.github/workflows/build-admin-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            flutter create --project-name caracal_admin --platforms=android .
          fi
      - name: Set app display name
        run: sed -i 's/android:label="caracal_admin"/android:label="CARACAL ADMIN"/' android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL || 'https://fabbzaviesndfobxhrxf.supabase.co' }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmYWJiemF2aWVzbmRmb2J4aHJ4ZiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzkzNTMxMjY3LCJleHAiOjIxMDkxMDcyNjd9.mwJfaLmV0dKso2dsXxX3gr2naFYqFEFtGi6Nw731RNk' }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CARACAL-ADMIN-APK
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
