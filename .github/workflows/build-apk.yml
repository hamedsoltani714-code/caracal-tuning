name: Build CARACAL TUNING APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name=caracal_tuning .

      - name: Set Android compile SDK 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Force file_picker compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          files = list(root.glob("file_picker-*/android/**/*.gradle"))
          files += list(root.glob("file_picker-*/android/**/*.gradle.kts"))

          if not files:
              raise SystemExit("ERROR: file_picker Gradle files not found")

          changed = False

          for path in files:
              source = path.read_text()

              pattern = r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(\d+|flutter\.compileSdkVersion)\b"

              updated, count = re.subn(
                  pattern,
                  r"\g<1>36",
                  source
              )

              if count:
                  path.write_text(updated)
                  changed = True
                  print("Updated:", path, "Changes:", count)

          if not changed:
              for path in files:
                  print("\n---", path, "---")
                  print(path.read_text())

              raise SystemExit("ERROR: compileSdk declaration not found")

          PY

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CARACAL-TUNING-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
