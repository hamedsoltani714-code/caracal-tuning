name: Build CARACAL TUNING APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            flutter create --project-name caracal_tuning --platforms=android .
          fi

      - name: Configure Android SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure file_picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          files = list(root.glob("file_picker-*/android/**/*.gradle"))
          files += list(root.glob("file_picker-*/android/**/*.gradle.kts"))

          for path in files:
              source = path.read_text()
              updated = re.sub(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(\d+|flutter\.compileSdkVersion)\b",
                  r"\g<1>36",
                  source
              )
              path.write_text(updated)
          PY

      - name: Generate application icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        run: flutter analyze
        continue-on-error: true

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://fabbzaviesndfobxhrxf.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhYmJ6YXZpZXNuZGZvYnhocnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MzEyNjcsImV4cCI6MjEwOTEwNzI2N30.mwJfaLmV0dKso2dsXxX3gr2naFYqFEFtGi6Nw731RNk' }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CARACAL-TUNING-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
