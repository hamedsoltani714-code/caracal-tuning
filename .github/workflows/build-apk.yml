name: Build CARACAL TUNING APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            flutter create --project-name caracal_tuning --platforms=android .
          fi
      
      - name: Use direct official Gradle distribution endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.is_file():
              raise SystemExit("Gradle wrapper properties file was not generated.")

          source = wrapper.read_text()
          updated = source.replace(
              "https\\://services.gradle.org/distributions/",
              "https://downloads.gradle.org/distributions/",
          ).replace(
              "https://services.gradle.org/distributions/",
              "https://downloads.gradle.org/distributions/",
          )
          if "downloads.gradle.org/distributions/" not in updated:
              raise SystemExit("Unexpected Gradle distribution URL; refusing to guess.")
          if "downloads.gradle.org/distributions/" not in updated:
              raise SystemExit("Direct Gradle distribution URL was not configured.")

          wrapper.write_text(updated)
          print("Gradle wrapper configured to use the official direct distribution host.")
          print(next(line for line in updated.splitlines() if line.startswith("distributionUrl=")))
          PY

      - name: Ensure Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
          ]
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}"/>'
              if permission not in source:
                  source = source.replace(
                      "<application",
                      f"    {tag}\n    <application",
                      1,
                  )
          manifest.write_text(source)
          print("Android internet and network-state permissions are present.")
          PY
      - name: Configure CARACAL email confirmation deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          intent_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.example.caracal_tuning" android:host="login-callback" />
                  </intent-filter>
          """
          if "com.example.caracal_tuning" not in source:
              source = source.replace("</activity>", intent_filter + "\n        </activity>", 1)
          manifest.write_text(source)
          print("CARACAL email confirmation deep link configured.")
          PY

      - name: Configure Android SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure file_picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          files = list(root.glob("file_picker-*/android/**/*.gradle"))
          files += list(root.glob("file_picker-*/android/**/*.gradle.kts"))

          for path in files:
              source = path.read_text()
              updated = re.sub(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(\d+|flutter\.compileSdkVersion)\b",
                  r"\g<1>36",
                  source
              )
              path.write_text(updated)
          PY

      - name: Generate application icons
        run: dart run flutter_launcher_icons

      - name: Work around Android Lint release analyzer crash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/build.gradle")
          if not gradle.is_file():
              raise SystemExit("Root Android Gradle file not found")
          source = gradle.read_text()
          marker = "// CARACAL: disable broken release lint analyzer"
          if marker not in source:
              source += "\\n\\n" + marker + "\\nsubprojects {\\n    tasks.configureEach {\\n        if (name == 'lintVitalAnalyzeRelease') {\\n            enabled = false\\n        }\\n    }\\n}\\n"
              gradle.write_text(source)
          print("Disabled only the crashing lintVitalAnalyzeRelease task; APK compilation remains enabled.")
          PY

      - name: Analyze Flutter project
        run: flutter analyze lib test --no-fatal-infos

      - name: Build Release APK
        env:
          SUPABASE_URL: https://fabbzaviesndfobxhrxf.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhYmJ6YXZpZXNuZGZvYnhocnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MzEyNjcsImV4cCI6MjEwOTEwNzI2N30.mwJfaLmV0dKso2dsXxX3gr2naFYqFEFtGi6Nw731RNk
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          set +e
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3"
            flutter build apk --release --obfuscate \
              --split-debug-info=build/symbols \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" 2>&1 | tee /tmp/caracal-main-build.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi 'HTTP response code: (502|503|504)|timed out|Connection reset|UnknownHostException|Temporary failure in name resolution' /tmp/caracal-main-build.log; then
              echo "Non-network build error detected; not retrying."
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient Gradle download/network error; retrying in 15 seconds."
              sleep 15
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CARACAL-TUNING-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
