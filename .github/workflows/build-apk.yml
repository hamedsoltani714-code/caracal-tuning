name: Build CARACAL TUNING APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Set Android compile SDK 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Fix file_picker compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          files = list(root.glob("file_picker-*/android/**/*.gradle"))
          files += list(root.glob("file_picker-*/android/**/*.gradle.kts"))

          for path in files:
              source = path.read_text()
              updated = re.sub(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(\d+|flutter\.compileSdkVersion)\b",
                  r"\g<1>36",
                  source
              )
              path.write_text(updated)
          PY

      - name: Generate app icons
        run: |
          mkdir -p assets/images
          cp assets/130315.png assets/images/130315.png
          dart run flutter_launcher_icons

      - name: Analyze Flutter code
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CARACAL-TUNING-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
